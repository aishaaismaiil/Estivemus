<style>
:root{--bg:#F7F2EA;--card:#fff;--ink:#16202A;--mut:#667085;--line:#E8DFD1;--soft:#F1E7D8;--brand:#E2512D;--brand2:#F28A4B;--teal:#0F6B6B;--tealsoft:#DCEFEC;--ok:#1E8E5A;--warn:#B7791F;--r:18px;--sh:0 8px 24px rgba(22,32,42,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#EFE8DC}
body{font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-size:15px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
#shell{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;box-shadow:0 0 60px rgba(0,0,0,.08)}
#top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 8px;position:sticky;top:0;background:linear-gradient(var(--bg) 75%,transparent);z-index:5}
.brand{display:flex;align-items:center;gap:9px;font-family:Fraunces,Georgia,serif;font-weight:700;font-size:23px;letter-spacing:-.02em}
.brand i{width:30px;height:30px;position:relative;display:block}
.brand i:before,.brand i:after{content:"";position:absolute;width:19px;height:19px;border-radius:50%;top:5px}
.brand i:before{left:1px;background:var(--brand)}.brand i:after{right:1px;background:var(--teal);mix-blend-mode:multiply}
.brand b{color:#B5472B}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--sh);color:var(--ink)}
main{padding:6px 18px 110px}
h1{font-size:28px;line-height:1.1;letter-spacing:-.03em;margin:10px 0 6px;font-weight:800}
h2{font-size:18px;margin:22px 0 10px;letter-spacing:-.02em}
h3{font-size:15px;margin:0 0 4px}
p{margin:6px 0;line-height:1.5}
.mut{color:var(--mut);font-size:14px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--sh)}
.card.flat{box-shadow:none;border:1px solid var(--line)}
label.l{display:block;font-size:13px;font-weight:700;margin:14px 0 6px}
input[type=text],input[type=date],select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:16px}
textarea{min-height:80px;resize:vertical}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:14px;font-weight:700;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 18px rgba(226,81,45,.28)}
.btn.full{width:100%;margin-top:14px}
.btn.teal{background:var(--teal);box-shadow:0 8px 18px rgba(15,107,107,.25)}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.danger{background:#fff;color:#B42318;border:1.5px solid #F2C9C4;box-shadow:none}
.btn.sm{padding:8px 13px;font-size:13px;border-radius:11px;box-shadow:none}
.btn[disabled]{opacity:.5}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.av{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:800;color:#fff;overflow:hidden;background:var(--brand)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.lg{width:96px;height:96px;font-size:34px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--soft)}
.pill.ok{background:#DDF3E8;color:#146C43}.pill.wait{background:#FBEBC8;color:#7A4B00}.pill.teal{background:var(--tealsoft);color:#0B5050}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 13px;border-radius:99px;border:1.5px solid var(--line);background:#fff;font-weight:600;font-size:14px}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
nav#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--mut);padding:6px 0;position:relative;border-radius:12px}
nav#nav button.on{color:var(--brand)}
.badge{position:absolute;top:0;left:56%;background:var(--brand);color:#fff;border-radius:99px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.tabs{display:flex;gap:6px;background:var(--soft);padding:4px;border-radius:14px;margin:12px 0}
.tabs button{flex:1;padding:9px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.deck{position:relative;height:440px;margin:12px 0}
.dcard{position:absolute;inset:0;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 18px 40px rgba(22,32,42,.16);touch-action:pan-y;user-select:none;cursor:grab;display:flex;flex-direction:column}
.dcard.back{transform:scale(.94) translateY(14px);opacity:.7;cursor:default}
.dphoto{flex:1;position:relative;display:grid;place-items:center;color:#fff;font-size:92px;font-weight:800;min-height:0}
.dphoto img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.dinfo{padding:16px 18px 18px}
.dinfo h3{font-size:22px;letter-spacing:-.02em}
.stamp{position:absolute;top:22px;padding:6px 14px;border:3px solid;border-radius:12px;font-weight:800;font-size:20px;opacity:0;transform:rotate(-10deg);background:rgba(255,255,255,.85)}
.stamp.y{left:18px;color:var(--ok);border-color:var(--ok)}.stamp.n{right:18px;color:#B42318;border-color:#B42318;transform:rotate(10deg)}
.actions{display:flex;justify-content:center;gap:22px;margin:6px 0}
.round{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#fff;box-shadow:var(--sh)}
.round.y{color:#fff;background:var(--ok)}.round.n{color:#B42318}.round.i{width:48px;height:48px;align-self:center;color:var(--mut)}
.sheet{position:fixed;inset:0;background:rgba(14,22,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet[hidden]{display:none}
.panel{width:100%;max-width:480px;max-height:93vh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px 18px 30px}
.panel .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photo{position:relative;border-radius:14px;overflow:hidden;background:#000;cursor:pointer;aspect-ratio:4/3}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo span{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.65));color:#fff;font-size:12px;font-weight:600}
.pwrap{position:relative;border-radius:16px;overflow:hidden}
.pwrap img{width:100%;display:block}
.dot{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--brand);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)}
.dot.p{background:var(--warn)}
.tog{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.tog:last-child{border:0}
.sw{appearance:none;width:46px;height:28px;border-radius:99px;background:#CBD5E1;position:relative;flex:none;transition:.2s}
.sw:checked{background:var(--teal)}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw:checked:after{left:21px}
.opt{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:#fff;margin:6px 0;font-weight:600}
.opt.on{border-color:var(--teal);background:var(--tealsoft)}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,10px);background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:min(92vw,440px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.hero{margin:6px 0 0}
.sug{border:1.5px solid var(--line);border-radius:14px;background:#fff;margin-top:6px;overflow:hidden}
.sug button{display:block;width:100%;text-align:left;padding:11px 14px;border-bottom:1px solid var(--line)}
.sug button:last-child{border:0}
.empty{text-align:center;padding:28px 10px;color:var(--mut)}
.empty svg{color:var(--line)}
.err{background:#FEF3F2;color:#912018;border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.small{font-size:12px;color:var(--mut)}
a{color:var(--brand)}

@media(display-mode:standalone){#top{padding-top:calc(14px + env(safe-area-inset-top))}.au-art{padding-top:calc(28px + env(safe-area-inset-top))}}
/* ---- login ---- */
.au [hidden]{display:none!important}
.au{position:fixed;inset:0;z-index:99;background:var(--bg);display:grid;grid-template-columns:1fr;overflow:auto}
.au-art{background:linear-gradient(160deg,#B5472B,#8A3520);color:#FBF6EA;padding:28px 24px 30px}
.au-art .brand{color:#FBF6EA}.au-art .brand b{color:#F2C14E}
.au-art h2{font-family:Fraunces,Georgia,serif;font-size:30px;line-height:1.12;margin:22px 0 8px;letter-spacing:-.02em;color:#FBF6EA}
.au-art p{color:#F3E1D2;margin:0 0 4px}
.au-pts{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:12px}
.au-pts li{display:flex;gap:12px;align-items:flex-start;font-size:15px;line-height:1.4}
.au-pts li span{flex:none;width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.14);display:grid;place-items:center;font-size:18px}
.au-pts.hide-m{display:none}
.au-form{padding:22px 18px 40px;display:flex;align-items:flex-start;justify-content:center}
.au-card{width:100%;max-width:420px}
.au-card h1{font-size:26px;margin:0 0 4px}
.au-seg{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;margin:14px 0 6px}
.au-seg button{padding:12px 8px;border-radius:11px;font-weight:800;font-size:15px;color:var(--mut)}
.au-seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(22,32,42,.12)}
.au-card input[type=text],.au-card input[type=email],.au-card input[type=password]{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-size:16px}
.au-pw{position:relative}.au-pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:8px 10px;font-size:13px;font-weight:700;color:var(--teal)}
.au-chk{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mut);margin:14px 0 4px;line-height:1.4}
.au-chk input{width:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--brand)}
.au-go{width:100%;margin-top:16px;padding:16px;font-size:16px}
.au-link{display:block;margin:14px auto 0;color:var(--teal);font-weight:700;font-size:14px;text-decoration:underline}
.ok{background:#E8F5EE;color:#14633F;border-radius:12px;padding:12px 14px;font-size:14px;margin:12px 0;line-height:1.45}
@media(min-width:860px){
  .au{grid-template-columns:1.05fr 1fr}
  .au-art{padding:56px 56px;display:flex;flex-direction:column;justify-content:center}
  .au-art h2{font-size:46px;margin-top:40px}.au-art p{font-size:18px}
  .au-pts{margin-top:30px;gap:16px}.au-pts li{font-size:17px}.au-pts.hide-m{display:grid}
  .au-form{align-items:center;padding:40px}.au-card{max-width:440px}
}
/* ---- computador ---- */
@media(min-width:900px){
  html,body{background:var(--bg)}
  #shell{max-width:1180px;padding-left:240px;box-shadow:none;background:transparent}
  nav#nav{left:max(0px,calc(50% - 590px));transform:none;top:0;bottom:0;width:240px;max-width:240px;flex-direction:column;justify-content:flex-start;gap:4px;padding:96px 14px 20px;border-top:0;border-right:1px solid var(--line);background:#fff}
  nav#nav button{flex:none;flex-direction:row;justify-content:flex-start;gap:14px;font-size:15px;padding:13px 16px}
  nav#nav button.on{background:var(--soft)}
  .badge{position:static;margin-left:auto}
  #top{position:fixed;top:0;left:max(0px,calc(50% - 590px));width:240px;background:#fff;padding:20px 22px;border-right:1px solid var(--line);z-index:6}
  #top>*:not(.brand){display:none}
  main{max-width:820px;margin:0 auto;padding:30px 36px 60px}
  h1{font-size:34px}
  .deck{height:540px}
  .sheet{align-items:center}
  .panel{max-width:600px;border-radius:26px;max-height:90vh}
  #toast{bottom:32px}
}
</style>

<body>
<div id="shell">
  <div id="top"></div>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div id="sheet" class="sheet" hidden></div>
<div id="sheet2" class="sheet" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/*LOGIC*/
const THIS_YEAR=new Date().getFullYear();
const LEVELS=[["creche","Creche"],["pre","Pré-escolar"],["c1","1.º ciclo"],["c2","2.º ciclo"],["c3","3.º ciclo"],["sec","Secundário"],["sup","Ensino superior"]];
const LV=Object.fromEntries(LEVELS);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const hash=s=>{let x=7;for(const c of String(s))x=(x*31+c.charCodeAt(0))>>>0;return x};
function overlap(a,b){if(!a||!b||a.instId!==b.instId)return 0;const lo=Math.max(a.from,b.from),hi=Math.min(a.to,b.to);return hi>=lo?hi-lo+1:0}
function sharedWith(me,o){const out=[];for(const a of(me.history||[]))for(const b of(o.history||[])){const n=overlap(a,b);if(n>0)out.push({a,b,years:n,from:Math.max(a.from,b.from),to:Math.min(a.to,b.to)})}return out.sort((x,y)=>y.years-x.years)}
function coversYear(e,y){return e.from<=y&&y<=e.to}
function displayName(p){const n=(p.name||"").trim();const parts=n.split(/\s+/);if(p.privacy&&p.privacy.showSurname===true)return n;return parts.length>1?parts[0]+" "+parts[parts.length-1][0]+".":n}
function searchText(p){const n=norm(p.name);if(p.privacy&&p.privacy.showSurname===true)return n+" "+norm(p.schoolName);return n.split(/\s+/)[0]}
function filterProfiles(profiles,selfId,f,blocked){
  const q=norm(f.q);const out=[];
  for(const id of Object.keys(profiles)){const p=profiles[id];
    if(id===selfId||(p.privacy&&p.privacy.hidden===true)||(blocked&&blocked[id]))continue;
    const any=f.inst||f.year||f.level||f.cls;
    let entries=p.history||[];
    if(any)entries=entries.filter(e=>(!f.inst||e.instId===f.inst)&&(!f.year||coversYear(e,+f.year))&&(!f.level||(e.levels||[]).includes(f.level))&&(!f.cls||norm(e.cls).includes(norm(f.cls))));
    if(any&&!entries.length)continue;
    if(q&&!searchText(p).includes(q))continue;
    out.push({id,p,entries})}
  return out}
function fmtYears(e){return e.from===e.to?String(e.from):e.from+"–"+(e.now?"hoje":e.to)}
function levelsText(e){const l=(e.levels||[]).map(k=>LV[k]).filter(Boolean);return l.length>3?l[0]+" a "+l[l.length-1]:l.join(", ")}
/*END*/

/* ---------- i18n (PT-PT é a língua de origem; EN e ES traduzem em runtime) ---------- */
const LANGS={pt:{n:"Português",loc:"pt-PT",html:"pt-PT"},en:{n:"English",loc:"en-GB",html:"en"},es:{n:"Español",loc:"es-ES",html:"es"}};
let LANG="pt";
try{const s=localStorage.getItem("reenc_lang");if(s&&LANGS[s])LANG=s;else{const n=(navigator.language||"pt").slice(0,2);if(LANGS[n])LANG=n}}catch(_){}
const DICT={
"Sugestões":["Suggestions","Sugerencias"],"Procurar":["Search","Buscar"],"Turmas":["Classes","Clases"],"Alertas":["Alerts","Alertas"],"Perfil":["Profile","Perfil"],
"Idioma":["Language","Idioma"],"Descarregar os meus dados":["Download my data","Descargar mis datos"],"Política de privacidade":["Privacy policy","Política de privacidad"],"Termos":["Terms","Términos"],"Sobre o Estivemus":["About Estivemus","Sobre Estivemus"],"Ficheiro descarregado.":["File downloaded.","Archivo descargado."],"Convidar colegas":["Invite classmates","Invitar a compañeros"],
"Quase lá":["Almost there","Casi listo"],"A carregar…":["Loading…","Cargando…"],
"Está a demorar. Verifica a ligação; os dados podem estar desatualizados.":["This is taking a while. Check your connection; the data may be out of date.","Está tardando. Comprueba tu conexión; los datos pueden estar desactualizados."],
"Abre esta app no claude.ai com a tua conta para guardar e partilhar dados.":["Open this app on claude.ai with your account to save and share data.","Abre esta app en claude.ai con tu cuenta para guardar y compartir datos."],
"Para usar a app precisas de ter sessão iniciada no claude.ai e acesso a esta página. Pede ao dono para te partilhar como Contribuidor.":["To use the app you need to be signed in to claude.ai and have access to this page. Ask the owner to share it with you as a Contributor.","Para usar la app necesitas haber iniciado sesión en claude.ai y tener acceso a esta página. Pide al propietario que te la comparta como Colaborador."],
"Não foi possível identificar a tua conta.":["We couldn't identify your account.","No pudimos identificar tu cuenta."],
"O teu acesso a esta app foi retirado.":["Your access to this app was removed.","Se ha retirado tu acceso a esta app."],
"Fotografias antigas de turma":["Old class photographs","Fotografías antiguas de clase"],
"Fotografia antiga de turma":["Old class photograph","Fotografía antigua de clase"],
"Quem estava contigo na escola?":["Who was at school with you?","¿Quién estaba contigo en el colegio?"],
"Encontra antigos colegas de creche, escola e universidade pelo sítio e pelos anos em que lá estiveste. Sem pagar para contactar.":["Find old classmates from nursery, school and university by place and the years you were there. No paying to get in touch.","Encuentra a antiguos compañeros de guardería, colegio y universidad por el lugar y los años en que estuviste. Sin pagar para contactar."],
"Criar o meu perfil":["Create my profile","Crear mi perfil"],"Estive lá":["I was there","Estuve allí"],"Reencontra quem também esteve.":["Find those who were there too.","Reencuentra a quien también estuvo."],"Era eu!":["That was me!","¡Era yo!"],

function trCore(s){

  return s}

function classPhoto(){
  let a=1996*7;const R=()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const cl=["#6B7F9A","#B5524A","#4F6B52","#C9A24B","#8A6A8F","#3E4A5C","#D9D2C3","#A3593B","#5E8C8C","#7A8F5A"],hr=["#2B2018","#4A3224","#7A5230","#C2A06A","#1B1613","#5A3A25"];
  const pick=l=>l[Math.floor(R()*l.length)];
  const row=(n,x0,x1,headY,sc,sit)=>{let o="";for(let i=0;i<n;i++){const x=x0+(x1-x0)*(i+.5)/n+(R()-.5)*8,k=sc*(.88+R()*.24),hy=headY+(R()-.5)*7,r=8.2*k,bw=30*k,bh=(sit?34:56)*k;
    const sk=`hsl(${20+Math.floor(R()*14)} ${35+Math.floor(R()*20)}% ${56+Math.floor(R()*20)}%)`;
    o+=`<rect x="${(x-bw/2).toFixed(1)}" y="${(hy+r*.8).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" rx="${(8*k).toFixed(1)}" fill="${pick(cl)}"/>`;
    o+=`<circle cx="${x.toFixed(1)}" cy="${hy.toFixed(1)}" r="${r.toFixed(1)}" fill="${sk}"/>`;
    o+=`<path d="M${(x-r).toFixed(1)} ${hy.toFixed(1)}a${r.toFixed(1)} ${r.toFixed(1)} 0 0 1 ${(2*r).toFixed(1)} 0c-${(r*.5).toFixed(1)} -${(r*.5).toFixed(1)} -${(r*1.5).toFixed(1)} -${(r*.5).toFixed(1)} -${(2*r).toFixed(1)} 0z" fill="${pick(hr)}"/>`}return o};
  const teacher=`<rect x="262" y="66" width="40" height="78" rx="12" fill="#7C4B54"/><circle cx="282" cy="56" r="11" fill="hsl(26 42% 66%)"/><path d="M271 54a11 11 0 0 1 22 0c-3-7-19-7-22 0z" fill="#3A2A20"/>`;
  return `<div style="margin:16px 0 4px;background:#FBF8F1;padding:9px 9px 24px;border-radius:3px;box-shadow:0 12px 26px rgba(22,32,42,.22),0 1px 2px rgba(0,0,0,.2);transform:rotate(-1.2deg)">
  <svg viewBox="0 0 330 226" width="100%" role="img" aria-label="Fotografia antiga de turma" style="display:block"><defs>
   <filter id="cpb" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="1.7"/><feColorMatrix type="saturate" values=".62"/></filter>
   <filter id="cpg"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7" result="n"/><feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .9 -.28"/></filter>
   <radialGradient id="cpv" cx="50%" cy="48%" r="70%"><stop offset=".55" stop-color="#2a170a" stop-opacity="0"/><stop offset="1" stop-color="#2a170a" stop-opacity=".55"/></radialGradient>
   <linearGradient id="cpl" x1="0" x2="1"><stop offset="0" stop-color="#ff8a3d" stop-opacity=".38"/><stop offset=".3" stop-color="#ff8a3d" stop-opacity="0"/></linearGradient>
   <clipPath id="cpc"><rect width="330" height="226"/></clipPath></defs>
  <g clip-path="url(#cpc)"><g filter="url(#cpb)">
   <rect width="330" height="226" fill="#DAD3C2"/><rect y="0" width="330" height="150" fill="#E7E1D3"/>
   <rect x="22" y="30" width="46" height="58" fill="#8FA7A5" opacity=".8"/><rect x="236" y="14" width="64" height="124" fill="#41624A"/><rect x="244" y="24" width="48" height="50" fill="#35523D"/>
   <rect y="146" width="330" height="80" fill="#A39579"/><rect y="146" width="330" height="5" fill="#8C7F66"/>
   ${row(9,28,296,76,1,false)}${teacher}${row(8,34,292,106,1.08,false)}${row(7,40,288,150,1.15,true)}
  </g>
  <rect width="330" height="226" fill="#E8B46F" opacity=".16" style="mix-blend-mode:multiply"/>
  <rect width="330" height="226" fill="url(#cpl)"/><rect width="330" height="226" fill="url(#cpv)"/>
  <rect width="330" height="226" filter="url(#cpg)" opacity="1" style="mix-blend-mode:overlay"/>
  <circle cx="72" cy="40" r="1.1" fill="#fff" opacity=".6"/><circle cx="238" cy="188" r="1.4" fill="#fff" opacity=".5"/><path d="M150 12l8 3" stroke="#fff" stroke-width=".8" opacity=".45"/></g></svg>
  <div style="font:600 12px/1 'Plus Jakarta Sans',sans-serif;color:#6b5e49;margin-top:9px;letter-spacing:.02em">Turma D · 1998</div></div>`}

function deckList(){const me=meP();if(!me)return[];const out=[];
  for(const [id,p] of Object.entries(S.profiles)){if(id===S.uid||(p.privacy&&p.privacy.hidden)||isBlocked(id)||S.recsMine[id])continue;
    const sh=sharedWith(me,p);if(!sh.length)continue;const isNo=!!(S.my.no||{})[id];
    if(S.deckMode==="new"&&isNo)continue;if(S.deckMode==="no"&&!isNo)continue;
    out.push({id,p,sh,score:sh.reduce((s,x)=>s+x.years,0)})}
  return out.sort((a,b)=>b.score-a.score||a.id.localeCompare(b.id))}

function cardHTML(x,top){const a=x.sh[0];const col=`linear-gradient(135deg,hsl(${hash(x.id)%360} 60% 52%),hsl(${(hash(x.id)+50)%360} 65% 40%))`;
  return `<div class="dcard ${top?"":"back"}" ${top?`id="topcard" data-id="${esc(x.id)}"`:""}>
   <div class="dphoto" style="background:${col}">${eraUrl(a.b)||x.p.photo?`<img src="${esc(eraUrl(a.b)||x.p.photo)}" alt="">`:esc((x.p.name||"?")[0].toUpperCase())}${eraUrl(a.b)?`<span class="pill" style="position:absolute;left:14px;bottom:12px;background:rgba(0,0,0,.6);color:#fff">Foto de ${eraPhoto(a.b).year}</span>`:""}

    <div class="mut">${a.b.cls?"Turma "+esc(a.b.cls):""}${a.b.cls&&a.a.cls?" · a tua: "+esc(a.a.cls):a.a.cls&&!a.b.cls?"A tua turma: "+esc(a.a.cls):""}</div></div></div>`}
function viewHome(){const L=deckList();const noCount=Object.keys(S.my.no||{}).filter(id=>S.profiles[id]&&!S.recsMine[id]).length;
  let body;
  if(!L.length){body=`<div class="empty">${ic("users",48)}<h3>${S.deckMode==="no"?"Já reviste todos":"Ainda não há mais sugestões"}</h3><p>${S.deckMode==="no"?"Não há mais pessoas por rever.":"Quando mais colegas das tuas escolas entrarem, aparecem aqui. Podes convidá-los."}</p>

  else{body=`<div class="deck">${L[1]?cardHTML(L[1],false):""}${cardHTML(L[0],true)}</div>
    <div class="actions"><button class="round n" data-act="swipe" data-k="no" aria-label="Não reconheço">${ic("x",30)}</button><button class="round i" data-act="open" data-id="${esc(L[0].id)}" aria-label="Ver perfil">${ic("info",22)}</button><button class="round y" data-act="swipe" data-k="yes" aria-label="Reconheço">${ic("check",30)}</button></div>
    <p class="small" style="text-align:center">Arrasta para a direita se reconheces, para a esquerda se não. Quem não reconheces continua a aparecer nas procuras.</p>`}
  const toggle=S.deckMode==="no"?`<button class="btn ghost sm" data-act="deck" data-k="new">${ic("back",16)} Voltar às novas</button>`:(noCount?`<button class="btn ghost sm" data-act="deck" data-k="no">${ic("undo",16)} Rever quem não reconheci (${noCount})</button>`:"");
  return `<h1>${S.deckMode==="no"?"Para rever":"Sugestões"}</h1><p class="mut">${L.length?L.length+" pessoa"+(L.length>1?"s":"")+" das tuas escolas":"Pessoas que estiveram nos mesmos sítios que tu"}</p>${body}<div style="text-align:center;margin-top:10px">${toggle}</div>`}
function bindDeck(){const el=$("#topcard");if(!el)return;let sx=0,dx=0,drag=false,moved=false;
  const stamp=d=>{const y=$("#sy"),n=$("#sn");if(y)y.style.opacity=Math.max(0,Math.min(1,d/90));if(n)n.style.opacity=Math.max(0,Math.min(1,-d/90))};
  el.onpointerdown=e=>{drag=true;moved=false;sx=e.clientX;try{el.setPointerCapture(e.pointerId)}catch(_){}el.style.transition="none"};
  el.onpointermove=e=>{if(!drag)return;dx=e.clientX-sx;if(Math.abs(dx)>6)moved=true;el.style.transform=`translateX(${dx}px) rotate(${dx/22}deg)`;stamp(dx)};
  el.onpointerup=()=>{if(!drag)return;drag=false;el.style.transition="transform .25s";
    if(dx>110)swipe("yes");else if(dx<-110)swipe("no");else{el.style.transform="";stamp(0);if(!moved)openProfile(el.dataset.id)}dx=0};
  el.onpointercancel=()=>{drag=false;el.style.transform="";stamp(0)}}
function swipe(k){const el=$("#topcard");if(!el)return;const id=el.dataset.id;el.style.transition="transform .3s,opacity .3s";el.style.transform=`translateX(${k==="yes"?520:-520}px) rotate(${k==="yes"?24:-24}deg)`;el.style.opacity="0";
  setTimeout(()=>{if(k==="yes")recognize(id);else{S.my.no=Object.assign({},S.my.no,{[id]:Date.now()});saveMy();render()}},230)}
function recognize(id){S.recsMine=Object.assign({},S.recsMine,{[id]:Date.now()});S.recs[S.uid]=S.recsMine;
  qw("recs",()=>S.db.doc("recs/"+S.uid).set({yes:S.recsMine,at:Date.now()}));
  if(S.my.no&&S.my.no[id]){delete S.my.no[id];saveMy()}
  const p=S.profiles[id]||{};
  if(mutual(id)){toast("Reconhecem-se! Já podes ver o contacto de "+displayName(p));openProfile(id)}else toast("Dissemos a "+displayName(p)+" que o reconheces.");render()}
function saveMy(){const snap=JSON.parse(JSON.stringify(S.my));qw("my",()=>S.db.doc("data/users/"+S.uid+"/state").set(snap))}

/* ---------- search ---------- */
function sel(id,opts,val,ph){return `<select id="${id}" data-in="${id}"><option value="">${ph}</option>${opts.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(val)?"selected":""}>${esc(l)}</option>`).join("")}</select>`}
function viewSearch(){const years=[];for(let y=THIS_YEAR;y>=1960;y--)years.push([y,y]);
  const insts=Object.entries(S.insts).sort((a,b)=>a[1].name.localeCompare(b[1].name)).map(([id])=>[id,instName(id)]);
  return `<h1>Procurar</h1><p class="mut">Por nome, ou por instituição e ano. Podes combinar.</p>
  <div class="card"><label class="l" for="q">Nome</label><input type="text" id="q" data-in="q" value="${esc(S.f.q)}" placeholder="Ex.: Marta">
  <label class="l" for="inst">Instituição</label>${insts.length?sel("inst",insts,S.f.inst,"Todas"):'<div class="card flat" style="margin:0"><p class="mut" style="margin:0">Ainda não há instituições registadas. Quem criar o perfil acrescenta a primeira.</p></div>'}
  <div class="grid2"><div><label class="l" for="year">Ano em que lá estiveram</label>${sel("year",years,S.f.year,"Qualquer")}</div><div><label class="l" for="level">Nível</label>${sel("level",LEVELS,S.f.level,"Todos")}</div></div>
  <label class="l" for="cls">Turma</label><input type="text" id="cls" data-in="cls" value="${esc(S.f.cls)}" placeholder="Ex.: D, ou Florinhas"></div>
  <div id="res">${resultsHTML()}</div>`}
function resultsHTML(){const f=S.f;const any=f.q||f.inst||f.year||f.level||f.cls;const total=Object.keys(S.profiles).filter(id=>id!==S.uid).length;
  if(!any)return `<div class="empty">${ic("search",44)}<p>${total?total+" pessoa"+(total>1?"s":"")+" na app. Escolhe um filtro para começar.":"Ainda ninguém além de ti. Convida colegas."}</p></div>`;
  if(!meP()){const n=filterProfiles(S.profiles,S.uid,f,{}).length;return `<div class="card"><h3>${n} ${n===1?"pessoa encontrada":"pessoas encontradas"}</h3><p class="mut">Cria o teu perfil para ver quem são. Só membros veem os nomes.</p><button class="btn full" data-act="editprofile">Criar o meu perfil</button></div>`}
  const me=meP();const L=filterProfiles(S.profiles,S.uid,f,S.my.blocks).map(r=>({...r,sh:me?sharedWith(me,r.p):[]})).sort((a,b)=>(b.sh.length>0)-(a.sh.length>0)||displayName(a.p).localeCompare(displayName(b.p)));
  if(!L.length)return `<div class="empty">${ic("users",44)}<p>Ninguém encontrado com estes filtros. Tenta menos filtros, ou convida colegas.</p></div>`;
  return `<p class="mut">${L.length} resultado${L.length>1?"s":""}</p>`+L.map(r=>{const e=r.entries[0];
    return `<button class="card row" style="width:100%;text-align:left;margin:8px 0" data-act="open" data-id="${esc(r.id)}">${avatar(r.p,r.id)}<div class="grow"><h3>${esc(displayName(r.p))}</h3>
    <div class="mut">${e?esc(instName(e.instId))+" · "+fmtYears(e):""}${e&&e.cls?" · turma "+esc(e.cls):""}</div></div>
    ${mutual(r.id)?'<span class="pill ok">Ligados</span>':S.recsMine[r.id]?'<span class="pill wait">Pendente</span>':r.sh.length?'<span class="pill teal">Estiveram juntos</span>':""}</button>`}).join("")}

/* ---------- classes ---------- */
function myInsts(){const m={};for(const e of((meP()||{}).history||[])){(m[e.instId]=m[e.instId]||[]).push(e)}return m}
function peopleAt(instId){const me=meP();const mine=myInsts()[instId]||[];const out=[];
  for(const [id,p] of Object.entries(S.profiles)){if(id===S.uid||(p.privacy&&p.privacy.hidden)||isBlocked(id))continue;let best=null;
    for(const a of mine)for(const b of(p.history||[])){const n=overlap(a,b);if(n>0&&(!best||n>best.n))best={n,from:Math.max(a.from,b.from),to:Math.min(a.to,b.to),cls:b.cls}}
    if(best)out.push({id,p,best})}
  return out.sort((a,b)=>b.best.n-a.best.n)}
function viewClasses(){const m=myInsts();const ids=Object.keys(m);
  if(!ids.length)return `<h1>Turmas</h1><div class="empty">${ic("school",44)}<p>Adiciona as tuas escolas no perfil para veres as turmas, fotos e reencontros.</p><button class="btn" data-act="editprofile">Editar perfil</button></div>`;
  return `<h1>As tuas turmas</h1><p class="mut">Pessoas, fotos antigas e reencontros de cada sítio onde estiveste.</p>`+ids.map(id=>{const es=m[id];const n=peopleAt(id).length;
    return `<button class="card row" style="width:100%;text-align:left" data-act="inst" data-id="${esc(id)}"><div class="av" style="background:var(--teal)">${ic("school",24)}</div><div class="grow"><h3>${esc(instName(id))}</h3><div class="mut">${es.map(fmtYears).join(" · ")}</div></div><span class="pill teal">${n} ${n===1?"pessoa":"pessoas"}</span></button>`}).join("")}
function myYearsAt(instId){const ys=new Set();for(const e of(myInsts()[instId]||[]))for(let y=e.from;y<=e.to;y++)ys.add(y);return[...ys].sort((a,b)=>b-a)}
function viewInst(){const id=S.inst;const t=S.instTab;let body="";
  if(t==="people"){const L=peopleAt(id);body=L.length?L.map(r=>`<button class="card row" style="width:100%;text-align:left;margin:8px 0" data-act="open" data-id="${esc(r.id)}">${avatar(r.p,r.id)}<div class="grow"><h3>${esc(displayName(r.p))}</h3><div class="mut">${r.best.from===r.best.to?r.best.from:r.best.from+"–"+r.best.to}${r.best.cls?" · turma "+esc(r.best.cls):""}</div></div>${mutual(r.id)?'<span class="pill ok">Ligados</span>':S.recsMine[r.id]?'<span class="pill wait">Pendente</span>':""}</button>`).join(""):`<div class="empty">${ic("users",44)}<p>Ainda ninguém desta turma. Convida colegas.</p><button class="btn" data-act="invite">${ic("copy",18)} Copiar convite</button></div>`}
  else if(t==="photos"){const ys=new Set(myYearsAt(id));const L=Object.entries(S.photos).filter(([k,p])=>p.instId===id&&ys.has(p.year)).sort((a,b)=>(b[1].at||0)-(a[1].at||0));
    body=`<button class="btn full teal" data-act="addphoto">${ic("camera",20)} Carregar foto antiga</button>`+(L.length?`<div class="grid2" style="margin-top:14px">${L.map(([k,p])=>`<div class="photo" data-act="photo" data-id="${esc(k)}"><img src="${esc(p.url)}" alt="${esc(p.caption||"Foto de turma")}" loading="lazy"><span>${p.year}${p.caption?" · "+esc(p.caption):""}</span></div>`).join("")}</div>`:`<div class="empty">${ic("image",44)}<p>Ainda não há fotos desta turma. Procura na gaveta a foto de turma!</p></div>`)}
  else{const L=Object.entries(S.events).filter(([k,e])=>e.instId===id).sort((a,b)=>(b[1].at||0)-(a[1].at||0));
    body=`<button class="btn full teal" data-act="addevent">${ic("cal",20)} Organizar reencontro</button>`+(L.length?L.map(([k,e])=>{const votes=e.votes||{};const mine=votes[S.uid];
      return `<div class="card"><h3>${esc(e.title)}</h3><div class="mut">${Object.keys(votes).length} resposta${Object.keys(votes).length===1?"":"s"}</div>${(e.dates||[]).map((d,i)=>{const c=Object.values(votes).filter(v=>v===i).length;return `<button class="opt ${mine===i?"on":""}" data-act="vote" data-id="${esc(k)}" data-i="${i}"><span>${esc(dateFmt(d))}</span><span>${c} ${c===1?"voto":"votos"}</span></button>`}).join("")}</div>`}).join(""):`<div class="empty">${ic("cal",44)}<p>Ainda não há reencontros marcados.</p></div>`)}
  return `<button class="btn ghost sm" data-act="instback">${ic("back",16)} Turmas</button><h1 style="font-size:24px">${esc(instName(id))}</h1><div class="mut">${(myInsts()[id]||[]).map(fmtYears).join(" · ")}</div>
  <div class="tabs">${[["people","Pessoas"],["photos","Fotos"],["events","Reencontros"]].map(([k,l])=>`<button class="${t===k?"on":""}" data-act="itab" data-k="${k}">${l}</button>`).join("")}</div>${body}`}

/* ---------- alerts ---------- */
function viewAlerts(){let h="<h1>Alertas</h1>";
  const inc=Object.keys(S.recs).filter(id=>id!==S.uid&&S.recs[id][S.uid]&&!S.recsMine[id]&&!(S.my.dismiss||{})[id]&&!isBlocked(id)&&S.profiles[id]);
  const tags=[];for(const [k,ph] of Object.entries(S.photos))for(const [tid,t] of Object.entries(ph.tags||{}))if(t.uid===S.uid&&t.status==="pending")tags.push({k,tid,ph});
  const mm=Object.keys(S.recsMine).filter(id=>mutual(id)&&S.profiles[id]&&!isBlocked(id));
  const fresh=Object.entries(S.profiles).filter(([id,p])=>id!==S.uid&&p.createdAt>Date.now()-14*864e5&&meP()&&sharedWith(meP(),p).length&&!(p.privacy&&p.privacy.hidden)&&!isBlocked(id));
  if(!inc.length&&!tags.length&&!mm.length&&!fresh.length)h+=`<div class="empty">${ic("bell",44)}<p>Sem novidades. Avisamos quando alguém te reconhecer ou entrar numa das tuas turmas.</p></div>`;
  inc.forEach(id=>{const p=S.profiles[id];h+=`<div class="card"><div class="row">${avatar(p,id)}<div class="grow"><h3>${esc(displayName(p))} diz que te reconhece</h3><div class="mut">${S.profiles[S.uid]&&sharedWith(meP(),p)[0]?esc(instName(sharedWith(meP(),p)[0].a.instId)):""}</div></div></div>
   <div class="row" style="margin-top:12px;flex-wrap:wrap"><button class="btn sm teal" data-act="rec" data-id="${esc(id)}">${ic("check",16)} Também reconheço</button><button class="btn sm ghost" data-act="open" data-id="${esc(id)}">Ver perfil</button><button class="btn sm ghost" data-act="dismiss" data-id="${esc(id)}">Agora não</button></div></div>`});
  tags.forEach(({k,tid,ph})=>{const by=S.profiles[ph.tags[tid].by];h+=`<div class="card"><div class="row"><div class="photo" style="width:84px;flex:none" data-act="photo" data-id="${esc(k)}"><img src="${esc(ph.url)}" alt=""></div><div class="grow"><h3>${esc(by?displayName(by):"Alguém")} marcou-te numa foto</h3><div class="mut">${esc(instName(ph.instId))} · ${ph.year}</div></div></div>
   <div class="row" style="margin-top:12px"><button class="btn sm teal" data-act="tagok" data-id="${esc(k)}" data-t="${esc(tid)}">Aprovar</button><button class="btn sm ghost" data-act="tagno" data-id="${esc(k)}" data-t="${esc(tid)}">Recusar</button></div></div>`});
  if(mm.length){h+="<h2>Ligados</h2>";mm.forEach(id=>{const p=S.profiles[id];h+=`<button class="card row" style="width:100%;text-align:left;margin:8px 0" data-act="open" data-id="${esc(id)}">${avatar(p,id)}<div class="grow"><h3>${esc(displayName(p))}</h3><div class="mut">${p.contact?"Contacto disponível":"Ainda sem contacto partilhado"}</div></div><span class="pill ok">Ligados</span></button>`})}
  if(fresh.length){h+="<h2>Novos nas tuas turmas</h2>";fresh.forEach(([id,p])=>{h+=`<button class="card row" style="width:100%;text-align:left;margin:8px 0" data-act="open" data-id="${esc(id)}">${avatar(p,id)}<div class="grow"><h3>${esc(displayName(p))}</h3><div class="mut">Entrou · ${esc(instName(sharedWith(meP(),p)[0].a.instId))}</div></div></button>`})}
  return h}

/* ---------- me ---------- */
function viewMe(){const p=meP();const t=(k,l,d)=>`<div class="tog"><div><b>${l}</b><div class="small">${d}</b></div></div><input class="sw" type="checkbox" data-act="priv" data-k="${k}" ${(k==="hidden"?!(p.privacy&&p.privacy.hidden):(p.privacy&&p.privacy[k]===true)||(k==="tags"&&!(p.privacy&&p.privacy.tags===false)))?"checked":""}></div>`;
  return `<div class="row" style="margin-top:6px">${avatar(p,S.uid,"lg")}<div class="grow"><h1 style="margin:0;font-size:24px">${esc(p.name)}</h1><div class="mut">${esc(p.about||"")}</div></div></div>
  <button class="btn ghost full" data-act="editprofile">${ic("edit",18)} Editar perfil</button>
  <h2>Onde estiveste</h2>${(p.history||[]).map(e=>`<div class="card row">${eraThumb(e)||`<div class="av" style="background:var(--teal)">${ic("school",22)}</div>`}<div class="grow"><h3>${esc(instName(e.instId))}</h3><div class="mut">${fmtYears(e)} · ${esc(levelsText(e))}${e.cls?" · turma "+esc(e.cls):""}</div></div></div>`).join("")||'<p class="mut">Ainda sem instituições.</p>'}
  <h2>Privacidade</h2><div class="card">${t("hidden","Aparecer nas procuras e sugestões","Se desligares, ninguém te encontra.")}${t("showSurname","Mostrar o meu nome completo","Por defeito só aparece o primeiro nome e a inicial do apelido.")}${t("tags","Permitir marcações em fotos","Cada marcação precisa da tua aprovação.")}</div>
  <button class="btn ghost full" data-act="invite">${ic("copy",18)} Convidar colegas</button>
  ${S.sb?`<button class="btn ghost full" data-act="logout" style="margin-bottom:10px">Terminar sessão</button>`:""}<button class="btn ghost full" data-act="export">${ic("copy",18)} Descarregar os meus dados</button><button class="btn danger full" data-act="delacc">${ic("trash",18)} Apagar a minha conta</button><p class="small" style="text-align:center;margin-top:18px"><a href="../privacidade.html" target="_blank" rel="noopener">Política de privacidade</a> · <a href="../termos.html" target="_blank" rel="noopener">Termos</a></p>`}

/* ---------- sheets ---------- */
function openSheet(id,html){const s=$("#"+id);s.innerHTML=`<div class="panel" role="dialog" aria-modal="true">${html}</div>`;s.hidden=false}
function closeSheet(id){const s=$("#"+id);s.hidden=true;s.innerHTML=""}
const head=(t,id)=>`<div class="head"><h1 style="font-size:22px;margin:0">${t}</h1><button class="icon-btn" data-act="close" data-id="${id}" aria-label="Fechar">${ic("x",20)}</button></div>`;

function openProfile(id){const p=S.profiles[id];if(!p)return;const me=meP();const sh=me?sharedWith(me,p):[];const m=mutual(id);const mineRec=!!S.recsMine[id];
  openSheet("sheet",head("",
  "sheet")+`<div style="text-align:center">${avatar(p,id,"lg").replace('class="av lg"','class="av lg" style="margin:0 auto 10px;'+(p.photo?"":"background:linear-gradient(135deg,hsl("+hash(id)%360+" 60% 52%),hsl("+(hash(id)+40)%360+" 65% 42%))")+'"')}<h1 style="margin:4px 0">${esc(displayName(p))}</h1>${p.privacy&&p.privacy.showSurname&&p.schoolName?`<div class="mut">Na escola: ${esc(p.schoolName)}</div>`:""}${m?'<span class="pill ok">Ligados</span>':""}</div>
  ${p.about?`<div class="card flat"><p style="margin:0">${esc(p.about)}</p></div>`:""}
  ${sh.length?`<div class="card" style="background:var(--tealsoft);box-shadow:none"><h3>Estiveram juntos</h3>${sh.map(x=>`<div>${esc(instName(x.a.instId))} · ${x.from===x.to?x.from:x.from+"–"+x.to}${x.b.cls?" · turma "+esc(x.b.cls):""}</div>`).join("")}</div>`:""}
  <h2>Percurso</h2>${(p.history||[]).map(e=>`<div class="card flat"><h3>${esc(instName(e.instId))}</h3><div class="mut">${fmtYears(e)} · ${esc(levelsText(e))}${e.cls?" · turma "+esc(e.cls):""}</div>${e.note?`<div class="small" style="margin-top:4px">${esc(e.note)}</div>`:""}${(id===S.uid||sh.some(x=>x.b.id===e.id))&&eraPhoto(e)?`<img src="${esc(eraUrl(e))}" alt="Foto da época" style="width:100%;border-radius:12px;margin-top:8px">`:""}</div>`).join("")}
  ${m?`<div class="card"><h3>Contacto</h3><p>${p.contact?esc(p.contact):"Esta pessoa ainda não partilhou contacto."}</p></div>`:""}
  ${mineRec&&!m?'<p class="mut" style="text-align:center">Já lhe disseste que a reconheces. À espera que ela te reconheça também.</p>':""}
  ${!mineRec?`<button class="btn full" data-act="rec" data-id="${esc(id)}" data-close="1">${ic("check",20)} Reconheço-te</button>`:""}
  <div class="row" style="margin-top:14px"><button class="btn danger sm" data-act="report" data-id="${esc(id)}">${ic("flag",15)} Denunciar</button><button class="btn danger sm" data-act="block" data-id="${esc(id)}">${ic("block",15)} Bloquear</button></div>`)}

let D=null; // profile draft
function editProfile(){const p=meP();const mi=S.meInfo||{};
  D=p?JSON.parse(JSON.stringify(p)):{name:mi.name||"",schoolName:"",about:"",contact:"",photo:"",history:[],privacy:{showSurname:false,hidden:false,tags:true},adult:false};
  D.history=D.history||[];D.terms=!!p;D.adult=!!p;drawProfileSheet()}
function drawProfileSheet(){openSheet("sheet",`${head(meP()?"Editar perfil":"Criar perfil","sheet")}
  <div class="row" style="margin:8px 0"><div id="pav">${avatar({name:D.name,photo:D.photo},"me","lg")}</div><div class="grow"><label class="btn ghost sm" style="cursor:pointer">${ic("camera",16)} ${D.photo?"Mudar foto":"Adicionar foto"}<input type="file" accept="image/*" id="pf" hidden></label><p class="small">Uma foto atual ajuda os colegas a reconhecer-te. Podes juntar uma foto antiga mais tarde.</p></div></div>
  <label class="l" for="pn">Nome completo</label><input type="text" id="pn" value="${esc(D.name)}" autocomplete="name">
  <label class="l" for="ps">Nome que tinhas na escola, se for diferente (opcional)</label><input type="text" id="ps" value="${esc(D.schoolName)}" placeholder="Ex.: apelido de solteira">
  <label class="l" for="pa">Sobre ti (opcional)</label><textarea id="pa" placeholder="Ex.: Sentava-me ao fundo, jogava à bola no recreio…">${esc(D.about)}</textarea>
  <label class="l" for="pc">Contacto para quem se ligar contigo (opcional)</label><input type="text" id="pc" value="${esc(D.contact)}" placeholder="E-mail, telemóvel ou Instagram"><p class="small">Só mostramos a pessoas que também te reconhecem. Em teste fechado, evita dados sensíveis.</p>
  <h2>Onde estiveste</h2><div id="hist">${histHTML()}</div><p class="small">Dica: em cada instituição podes juntar uma foto da época. É o que mais ajuda os colegas a reconhecerem-te.</p>
  <button class="btn ghost full" data-act="addentry">${ic("plus",18)} Adicionar creche, escola ou universidade</button>
  ${meP()?"":`<label class="row" style="margin-top:18px;align-items:flex-start"><input type="checkbox" id="p18" ${D.adult?"checked":""}><span>Tenho 18 anos ou mais</span></label><label class="row" style="margin-top:8px;align-items:flex-start"><input type="checkbox" id="pt" ${D.terms?"checked":""}><span>Aceito que o meu nome, foto e percurso escolar sejam vistos por quem estiver nas minhas turmas</span></label>`}
  <button class="btn full" data-act="saveprofile">Guardar perfil</button>`);
  const f=$("#pf");if(f)f.onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const r=await readImage(file,256,.82);D.photo=r.dataUrl;$("#pav").innerHTML=avatar({name:D.name,photo:D.photo},"me","lg")}catch(_){toast("Não consegui ler essa imagem.")}}}
function histHTML(){return D.history.length?D.history.map((e,i)=>`<div class="card flat row"><div class="grow"><h3>${esc(instName(e.instId))}</h3><div class="mut">${fmtYears(e)} · ${esc(levelsText(e))}${e.cls?" · turma "+esc(e.cls):""}</div>${e.imgData||eraPhoto(e)?`<span class="pill teal">${ic("image",14)} com foto da época</span>`:`<span class="pill">sem foto da época</span>`}</div><button class="icon-btn" data-act="editentry" data-i="${i}" aria-label="Editar">${ic("edit",18)}</button><button class="icon-btn" data-act="delentry" data-i="${i}" aria-label="Remover">${ic("trash",18)}</button></div>`).join(""):'<p class="mut">Adiciona pelo menos uma instituição.</p>'}
function syncProfile(){const g=i=>{const e=$("#"+i);return e?e.value.trim():null};const n=g("pn");if(n!==null)D.name=n;const s=g("ps");if(s!==null)D.schoolName=s;const a=g("pa");if(a!==null)D.about=a;const c=g("pc");if(c!==null)D.contact=c;const x=$("#p18");if(x)D.adult=x.checked;const t=$("#pt");if(t)D.terms=t.checked}

let E=null,EI=-1;
function newEntry(){return{id:"e"+Date.now().toString(36),instId:"",instName:"",concelho:"",levels:[],from:THIS_YEAR-10,to:THIS_YEAR-6,now:false,cls:"",note:""}}
function openEntry(i){syncProfile();EI=i;E=i>=0?JSON.parse(JSON.stringify(D.history[i])):newEntry();if(E.instId)E.instName=(S.insts[E.instId]||{}).name||"";if(E.photoId&&S.photos[E.photoId])E.photoUrl=S.photos[E.photoId].url;if(E.imgData)E.photoUrl=E.imgData;drawEntry()}
function yearOpts(v,extra){let h="";for(let y=THIS_YEAR;y>=1960;y--)h+=`<option value="${y}" ${y==v?"selected":""}>${y}</option>`;return h}
function drawEntry(){openSheet("sheet2",`${head(EI>=0?"Editar instituição":"Onde estiveste","sheet2")}
  <label class="l" for="ei">Instituição</label><input type="text" id="ei" value="${esc(E.instName)}" placeholder="Nome da creche, escola ou universidade" autocomplete="off"><div id="sg"></div>
  <div id="ec" ${E.instId||!E.instName?"hidden":""}><label class="l" for="ecc">Concelho (para esta instituição nova)</label><input type="text" id="ecc" value="${esc(E.concelho)}" placeholder="Ex.: Loures"></div>

function loadScript(src){return new Promise((res,rej)=>{const e=document.createElement("script");e.src=src;e.onload=res;e.onerror=rej;document.head.appendChild(e)})}
const isObj=x=>x&&typeof x==="object"&&!Array.isArray(x);
function dmerge(a,b){const o=Object.assign({},a);for(const k of Object.keys(b)){o[k]=isObj(b[k])&&isObj(o[k])?dmerge(o[k],b[k]):b[k]}return o}
/* camada de dados sobre o Supabase, com a mesma API que a app já usa */
function makeSupaDb(sb,uid){
  const subs=[];const sp=p=>{const i=p.lastIndexOf("/");return [p.slice(0,i),p.slice(i+1)]};
  const fail=r=>{if(r.error){const e=new Error(r.error.message);e.code="invalid_argument";throw e}return r};
  const snapC=rows=>({docs:rows.map(r=>({id:r.id,data:()=>r.data}))});
  const snapD=r=>({exists:!!r,data:()=>r?r.data:undefined});
  async function readCol(col){
    const rows=fail(await sb.from("docs").select("id,data").eq("col",col)).data||[];
    if(col==="profiles"){const cs=fail(await sb.from("docs").select("id,data").eq("col","contacts")).data||[];const m={};cs.forEach(c=>m[c.id]=(c.data||{}).contact||"");
      rows.forEach(r=>{r.data=Object.assign({},r.data,{contact:m[r.id]||""})})}
    return rows}
  async function readDoc(p){const [c,i]=sp(p);const r=fail(await sb.from("docs").select("id,data").eq("col",c).eq("id",i).maybeSingle()).data;return r}
  async function put(p,data){const [c,i]=sp(p);fail(await sb.from("docs").upsert({col:c,id:i,owner:uid,data},{onConflict:"col,id"}))}
  const api={
    doc(p){return{
      async set(data){if(p.startsWith("profiles/")){const {contact,...rest}=data;await put("contacts/"+p.split("/")[1],{contact:contact||""});await put(p,rest)}else await put(p,data);kick()},
      async update(patch){const r=await readDoc(p);await put(p,dmerge(r?r.data:{},patch));kick()},
      async delete(){const [c,i]=sp(p);fail(await sb.from("docs").delete().eq("col",c).eq("id",i));if(c==="profiles")await sb.from("docs").delete().eq("col","contacts").eq("id",i);kick()},
      async get(){return snapD(await readDoc(p))},
      onSnapshot(cb,err){const f=async()=>{try{cb(snapD(await readDoc(p)))}catch(e){err&&err(e)}};subs.push(f);f();return()=>{subs.splice(subs.indexOf(f),1)}}}},
    collection(c){return{
      async add(data){const id="r"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);await put(c+"/"+id,data)},
      onSnapshot(cb,err){const f=async()=>{try{cb(snapC(await readCol(c)))}catch(e){err&&err(e)}};subs.push(f);f();return()=>{subs.splice(subs.indexOf(f),1)}}}}
  };
  let kt=0;function kick(){clearTimeout(kt);kt=setTimeout(()=>subs.forEach(f=>f()),600)}
  setInterval(()=>{if(!document.hidden)subs.forEach(f=>f())},12000);
  return api}

(async function boot(){

  const timer=setTimeout(()=>{S.slow=true;sched()},10000);
  let db=null,user=null;
  if(typeof claude!=="undefined"&&claude.use){
    try{db=await claude.use("db");user=await claude.use("user")}catch(_){}
    if(!db||!user){clearTimeout(timer);S.fatal="Para usar a app precisas de ter sessão iniciada no claude.ai e acesso a esta página. Pede ao dono para te partilhar como Contribuidor.";render();return}
    S.db=db;try{S.assets=await claude.use("assets")}catch(_){}
    S.uid=await user.id();try{S.meInfo=await user.me()}catch(_){}
    try{const c=await user.can("data.write");S.canWrite=c!==false}catch(_){}
  }else{
    try{const m=document.createElement("meta");m.httpEquiv="Content-Security-Policy";m.content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' "+SUPA_URL+"; object-src 'none'; base-uri 'self'; form-action 'self'";document.head.appendChild(m)}catch(_){}
